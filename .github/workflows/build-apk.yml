name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar íconos y pantalla de inicio
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2c1d55' --splashBackgroundColor '#0c0a12'

      - name: Sincronizar
        run: npx cap sync android

      - name: Usar la misma firma en cada versión
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Caudal.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Caudal-apk
          path: Caudal.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Caudal ${{ github.run_number }}
          body: Descarga **Caudal.apk** desde tu teléfono e instálala.
          files: Caudal.apk
